<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Home | Eutty Virtual Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Notification Modal Styles */
    .notification-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15,24,32,0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 1001; transition: opacity 0.2s;
    }
    .notification-modal[hidden] { display: none; }
    .notification-content {
      background: #fff; color: #1a2430; border-radius: 14px; max-width: 92vw; width: 360px; box-shadow: 0 6px 60px 0 #16244e33;
      padding: 2.2em 1.5em 1em 1.5em; position: relative; text-align: center;
      animation: notifDrop 0.4s cubic-bezier(.2,.75,.36,1.12);
    }
    @keyframes notifDrop {
      from { transform: translateY(-60px) scale(0.92); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .notification-content h3 { margin-top: 0; font-size: 1.35rem; }
    .notification-actions {
      margin-top: 1.6em; display: flex; gap: 1em; justify-content: center;
    }
    .notification-actions button {
      padding: 0.6em 1.3em; border: none; border-radius: 7px;
      font-weight: bold; cursor: pointer; font-size: 1em;
      background: #2356e2; color: #fff; transition: background 0.15s;
    }
    .notification-actions button.secondary {
      background: #d2d7e0; color: #2a3254;
    }
    /* Bell icon styles */
    .notif-bell {
      position: relative; display: inline-block; margin-left: 1.2em; cursor: pointer; vertical-align: middle;
    }
    .notif-bell svg {
      width: 27px; height: 27px; fill: #2356e2;
    }
    .notif-badge {
      position: absolute; top: 2px; right: 2px;
      background: #ff4747; color: #fff; border-radius: 50%; font-size: 0.67em; width: 17px; height: 17px;
      display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 2px 8px #0001;
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="nav">
    <div class="brand">Eutty<span class="accent">VA</span></div>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
    </nav>
    <!-- Notification Bell Icon -->
    <div class="notif-bell" id="notifBell" title="Notifications" tabindex="0" aria-label="Show notifications" style="outline:none;">
      <!-- Bell SVG icon -->
      <svg viewBox="0 0 24 24">
        <path d="M12 22c1.12 0 2-.88 2-2h-4a2 2 0 002 2zm8-6v-5c0-3.07-1.63-5.64-5-6.32V4a3 3 0 10-6 0v.68C5.63 5.36 4 7.92 4 11v5l-1.7 1.7A1 1 0 004 20h16a1 1 0 00.7-1.7L20 16zm-2 2H6v-6c0-2.97 1.63-5.43 6-5.43s6 2.46 6 5.43v6z"/>
      </svg>
      <span class="notif-badge" id="notifBadge" style="display:none;">1</span>
    </div>
  </header>

  <!-- Notification Modal -->
  <div class="notification-modal" id="notificationModal" hidden>
    <div class="notification-content">
      <!-- You can update the message/title below for new notifications.
           To force show for all users, increment the "notifVersion" in the JS below -->
      <h3>Important Notice</h3>
      <p>
        We are upgrading our security systems on 20th Oct 2025.<br>
        During this period, some services may be unavailable.<br>
        Please ensure your account details are up to date.<br>
        <small>— Eutty Virtual Admin Team</small>
      </p>
      <div class="notification-actions">
        <button id="notifCloseBtn">Got it</button>
        <button class="secondary" id="notifUnreadBtn">Mark as Unread</button>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <main class="main-wrap">
    <!-- ... (existing content unchanged) ... -->
    <!-- (paste all your main content here as in your original file) -->
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <small>© 2025 Eutty | Virtual Assistant</small>
  </footer>

  <!-- JS FOR NOTIFICATION MODAL -->
  <script>
    // === Notification system logic ===
    // Change this version number to "force" a new notification for all users.
    const notifVersion = "2025-10-16-2"; // <--- INCREMENT to show new notification to all

    const notifModal = document.getElementById('notificationModal');
    const notifBell = document.getElementById('notifBell');
    const notifBadge = document.getElementById('notifBadge');
    const notifCloseBtn = document.getElementById('notifCloseBtn');
    const notifUnreadBtn = document.getElementById('notifUnreadBtn');

    function getNotifState() {
      try {
        const state = localStorage.getItem("euttyva_notification");
        return state ? JSON.parse(state) : {};
      } catch { return {}; }
    }
    function setNotifState(state) {
      localStorage.setItem("euttyva_notification", JSON.stringify(state));
    }

    function isNotifUnread() {
      const state = getNotifState();
      return !state.version || state.version !== notifVersion || !state.read;
    }

    function showNotifModal() {
      notifModal.hidden = false;
      notifModal.setAttribute('aria-modal', 'true');
      notifModal.focus();
    }
    function hideNotifModal() {
      notifModal.hidden = true;
      notifModal.removeAttribute('aria-modal');
    }
    function showNotifBadge(show=true) {
      notifBadge.style.display = show ? '' : 'none';
    }

    // On load: show modal if unread
    document.addEventListener('DOMContentLoaded', () => {
      if(isNotifUnread()) {
        showNotifModal();
        showNotifBadge(true);
      } else {
        showNotifBadge(false);
      }
    });

    // Clicking bell opens modal
    notifBell.addEventListener('click', () => {
      showNotifModal();
    });

    // Keyboard accessibility for bell
    notifBell.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        showNotifModal();
      }
    });

    // Close button = mark as read
    notifCloseBtn.addEventListener('click', () => {
      setNotifState({version: notifVersion, read: true});
      hideNotifModal();
      showNotifBadge(false);
    });

    // Mark as unread (for testing or user preference)
    notifUnreadBtn.addEventListener('click', () => {
      setNotifState({version: notifVersion, read: false});
      showNotifBadge(true);
      hideNotifModal();
    });

    // Clicking outside modal closes it (optional)
    notifModal.addEventListener('click', (e) => {
      if(e.target === notifModal) hideNotifModal();
    });

    // ESC key closes modal
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape' && !notifModal.hidden) hideNotifModal();
    });
  </script>

  <!-- (existing scripts, e.g. 3D tilt, cards.js, etc.) -->
  <script>
    // ...Your existing JS code here...
  </script>
  <script src="cards.js"></script>
</body>
</html>
