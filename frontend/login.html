<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Alex VA Portal</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    margin:0; font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffd3e0, #a0c4ff);
    display:flex; align-items:center; justify-content:center; height:100vh;
  }
  .auth-card {
    backdrop-filter: blur(15px);
    background: rgba(43, 16, 16, 0.2);
    border-radius: 20px;
    padding: 40px;
    max-width: 360px;
    width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    text-align:center;
    transition: transform 0.5s ease;
  }
  .auth-card:hover { transform: translateY(-5px); }
  .auth-card h2 { margin-bottom:20px; color:#fff; text-shadow:0 2px 5px rgba(0,0,0,0.2);}
  input {
    width:100%; padding:12px 15px; margin:10px 0; border:none; border-radius:10px;
    outline:none; font-size:1rem;
    background: rgba(255,255,255,0.5);
    color:#333; transition: 0.3s;
  }
  input:focus { background: rgba(255,255,255,0.8); box-shadow: 0 0 8px #ff6b81; }
  button {
    width:100%; padding:12px; margin-top:15px; border:none; border-radius:10px;
    background: linear-gradient(135deg,#ff6b81,#fbc7d4);
    color:#fff; font-size:1rem; cursor:pointer; transition: 0.3s;
  }
  button:hover { transform: scale(1.05); box-shadow:0 5px 15px rgba(0,0,0,0.2);}
  .social-login { display:flex; justify-content:space-around; margin-top:15px; }
  .social-login button {
    width:30%; background:#fff; color:#333; font-size:0.8rem; font-weight:bold;
    border-radius:8px; transition:0.3s;
  }
  .social-login button:hover { transform: scale(1.1); box-shadow:0 5px 15px rgba(0,0,0,0.2);}
  a { color:#fff; text-decoration:none; font-weight:bold; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="auth-card">
  <h2>Hello there! 👋</h2>
  <form id="login-form">
    <input type="email" id="login-email" placeholder="Email" required>
    <input type="password" id="login-password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <p>Or login with:</p>
  <div class="social-login">
    <button class="google-btn">Google</button>
    <button class="facebook-btn">Facebook</button>
    <button class="apple-btn">Apple</button>
  </div>
  <p>Don't have an account? <a href="signup.html">Sign up</a></p>
</div>

<script>
  // Demo login behavior
  document.getElementById('login-form').addEventListener('submit', e=>{
    e.preventDefault();
    alert('✅ Logged in (demo)'); 
  });
</script>
</body>
</html>
