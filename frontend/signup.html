<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Alex VA Portal</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    margin:0; font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #a0c4ff, #ffd3e0);
    display:flex; align-items:center; justify-content:center; height:100vh;
  }
  .auth-card {
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 40px;
    max-width: 360px;
    width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    text-align:center;
    transition: transform 0.3s ease;
  }
  .auth-card:hover { transform: translateY(-5px); }
  .auth-card h2 { margin-bottom:20px; color:#fff; text-shadow:0 2px 5px rgba(0,0,0,0.2);}
  input {
    width:100%; padding:12px 15px; margin:10px 0; border:none; border-radius:10px;
    outline:none; font-size:1rem;
    background: rgba(255,255,255,0.5);
    color:#333; transition: 0.3s;
  }
  input:focus { background: rgba(255,255,255,0.8); box-shadow: 0 0 8px #ff6b81; }
  .password-match { font-size:0.85rem; margin-top:-8px; margin-bottom:8px; color:#fff; }
  button {
    width:100%; padding:12px; margin-top:15px; border:none; border-radius:10px;
    background: linear-gradient(135deg,#ff6b81,#fbc7d4);
    color:#fff; font-size:1rem; cursor:pointer; transition: 0.3s;
  }
  button:hover { transform: scale(1.05); box-shadow:0 5px 15px rgba(0,0,0,0.2);}
  .social-login { display:flex; justify-content:space-around; margin-top:15px; }
  .social-login button {
    width:30%; background:#fff; color:#333; font-size:0.8rem; font-weight:bold;
    border-radius:8px; transition:0.3s;
  }
  .social-login button:hover { transform: scale(1.1); box-shadow:0 5px 15px rgba(0,0,0,0.2);}
  a { color:#fff; text-decoration:none; font-weight:bold; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="auth-card">
  <h2>Create Your Account ✨</h2>
  <form id="signup-form">
    <input type="text" id="signup-name" placeholder="Full Name" required>
    <input type="email" id="signup-email" placeholder="Email" required>
    <input type="password" id="signup-password" placeholder="Password" required>
    <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
    <div class="password-match" id="password-match-msg"></div>
    <button type="submit">Sign Up</button>
  </form>

  <p>Or sign up with:</p>
  <div class="social-login">
    <button class="google-btn">Google</button>
    <button class="facebook-btn">Facebook</button>
    <button class="apple-btn">Apple</button>
  </div>

  <p>Already have an account? <a href="login.html">Login</a></p>
</div>

<script>
  const password = document.getElementById('signup-password');
  const confirmPassword = document.getElementById('signup-confirm-password');
  const matchMsg = document.getElementById('password-match-msg');

  // Real-time password match check
  confirmPassword.addEventListener('input', () => {
    if(confirmPassword.value === password.value){
      matchMsg.textContent = '✅ Passwords match';
      matchMsg.style.color = '#4CAF50';
    } else {
      matchMsg.textContent = '❌ Passwords do not match';
      matchMsg.style.color = '#FF6B6B';
    }
  });

  document.getElementById('signup-form').addEventListener('submit', e=>{
    e.preventDefault();
    if(password.value !== confirmPassword.value){
      alert('❌ Passwords do not match!');
      return;
    }
    // Demo signup
    alert('🎉 Account created! Please login.');
    window.location.href='login.html';
  });

  // Demo social signup
  document.querySelector('.google-btn').addEventListener('click', ()=>{
    alert('✅ Signed up with Google (demo)');
    window.location.href='dashboard.html';
  });
  document.querySelector('.facebook-btn').addEventListener('click', ()=>{
    alert('✅ Signed up with Facebook (demo)');
    window.location.href='dashboard.html';
  });
  document.querySelector('.apple-btn').addEventListener('click', ()=>{
    alert('✅ Signed up with Apple (demo)');
    window.location.href='dashboard.html';
  });
</script>
</body>
</html>
